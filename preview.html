<style>
:root{--acid:#c8ff32;--ink:#101510;--cream:#f1e7d2;--forest:#123b27}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.preview-bar{height:64px;background:#111;display:flex;align-items:center;gap:10px;padding:8px 14px;position:fixed;left:0;right:0;top:0;z-index:100}
.brand{font-weight:900;letter-spacing:-.06em;margin-right:14px;white-space:nowrap}
.nav{display:flex;gap:6px;overflow:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:1px solid #444;background:#191919;color:#aaa;border-radius:999px;padding:8px 12px;font-size:9px;letter-spacing:.12em;white-space:nowrap;cursor:pointer}
.nav button.active{background:var(--acid);color:var(--ink);border-color:var(--acid)}
#frame{position:absolute;top:64px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 64px);border:0;background:var(--cream)}
.hint{margin-left:auto;font-size:8px;color:#777;white-space:nowrap}

/* V42 — logo rendered as a true alpha mask: no image box can appear */
.logo .brand-symbol,
.header .brand-symbol,
.site-header .brand-symbol{
  width:34px!important;height:34px!important;
  display:block!important;
  object-fit:contain;
  background:#fff!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:
    0 1px 0 rgba(255,255,255,.42),
    0 3px 6px rgba(0,0,0,.16);
  -webkit-mask-image:url("mediabay-symbol-transparent.png");
  mask-image:url("mediabay-symbol-transparent.png");
  -webkit-mask-size:contain;
  mask-size:contain;
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  -webkit-mask-position:center;
  mask-position:center;
  filter:none!important;
  mix-blend-mode:normal!important;

  font-size:0!important;

<style id="mediabay-v65-motion-fix">
/* V65 — Premium Motion / robust mobile-safe reveal system */
:root{--mb65-ease:cubic-bezier(.16,1,.3,1)}
html{scroll-behavior:smooth;overflow-x:hidden}
/* Kill the previous conflicting reveal states and let V65 own the choreography. */
.mb-premium-reveal,.mb-reveal,.mb-title,.mb-service{opacity:1!important;transform:none!important;clip-path:none!important;visibility:visible!important}
.mb65-reveal{opacity:0!important;transform:translate3d(0,42px,0)!important;clip-path:inset(0 0 100% 0)!important;visibility:hidden!important;transition:opacity .72s var(--mb65-ease),transform .95s var(--mb65-ease),clip-path .95s var(--mb65-ease)!important}
.mb65-reveal.mb65-visible{opacity:1!important;transform:none!important;clip-path:inset(0)!important;visibility:visible!important}
.mb65-reveal[data-mb65-delay="1"]{transition-delay:.04s!important}.mb65-reveal[data-mb65-delay="2"]{transition-delay:.10s!important}.mb65-reveal[data-mb65-delay="3"]{transition-delay:.16s!important}.mb65-reveal[data-mb65-delay="4"]{transition-delay:.22s!important}.mb65-reveal[data-mb65-delay="5"]{transition-delay:.28s!important}
.mb65-depth{will-change:transform;transition:transform .16s linear}
.mb65-magnetic{will-change:transform;transition:transform .42s var(--mb65-ease)}
@media(max-width:700px){
 .mb65-reveal{transform:translate3d(0,26px,0)!important;transition-duration:.65s!important}
 .mb65-depth{transition:none}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}.mb65-reveal{opacity:1!important;transform:none!important;clip-path:none!important;visibility:visible!important;transition:none!important}.mb65-depth,.mb65-magnetic{transition:none!important;transform:none!important}
}
</style>

<style id="mediabay-v66-motion">
/* V66 — Premium motion, fail-safe: content is NEVER hidden while waiting for JS. */
:root{--mb66-ease:cubic-bezier(.16,1,.3,1)}
/* Neutralise previous reveal systems so they cannot blank a section. */
.mb-reveal,.mb-title,.mb-service,.mb65-reveal,.mb-premium-reveal{
  opacity:1!important; visibility:visible!important; transform:none!important; clip-path:none!important;
}
/* V66 animation is opt-in: JS adds this class only when an element is already on-screen. */
.mb66-motion{
  will-change:transform,opacity;
}
.mb66-motion.mb66-play{
  animation:mb66-enter .9s var(--mb66-ease) both;
  animation-delay:var(--mb66-delay,0ms);
}
@keyframes mb66-enter{
  from{opacity:.01;transform:translate3d(0,34px,0)}
  65%{opacity:1}
  to{opacity:1;transform:translate3d(0,0,0)}
}
@media(max-width:700px){
  .mb66-motion.mb66-play{animation-duration:.72s}
}
@media(prefers-reduced-motion:reduce){
  .mb66-motion.mb66-play{animation:none!important;opacity:1!important;transform:none!important}
}
</style>



<style id="mediabay-v68-cinematic-engine">
/* V68 — deterministic cinematic scroll. No dependency on ViewTimeline or hidden content. */
:root{--mb68-ease:cubic-bezier(.16,1,.3,1)}
html{scroll-behavior:auto}
main{scroll-snap-type:y proximity}
main>section{scroll-snap-align:start;scroll-snap-stop:normal}
/* CSS translate is independent from existing transform rules in the legacy site. */
main>section .head,
main>section .giant,
main>section .desc,
main>section .manifesto-statement,
main>section .manifesto-copy,
main>section .manifesto-pillars,

  translate:0 var(--mb68-shift,0px);
  scale:var(--mb68-scale,1);
  opacity:var(--mb68-opacity,1);
  will-change:translate,scale,opacity;
  transition:opacity .08s linear;
}
main>section .giant{transition:translate .04s linear,scale .04s linear,opacity .08s linear}
main>section .service-detail:nth-child(2){--mb68-delay:0}
main>section .service-detail:nth-child(3){--mb68-delay:1}
main>section .service-detail:nth-child(4){--mb68-delay:2}
main>section .service-detail:nth-child(5){--mb68-delay:3}
main>section .service-detail:nth-child(6){--mb68-delay:4}
main>section .service-detail:nth-child(7){--mb68-delay:5}

@media(max-width:700px){
  main>section .head,main>section .giant,main>section .desc,main>section .manifesto-statement,main>section .manifesto-copy,main>section .manifesto-pillars,main>section .services,main>section .service-detail,main>section .service-note,main>section .diagnostic,main>section .approach-bottom,main>section .internal-tech,main>section .experience-intro,main>section .sector-list,main>section .proof,main>section .contact-copy,main>section .contact-copy h2,main>section .contact-form{will-change:translate,opacity}
  main{scroll-snap-type:none}
}

<script id="mediabay-v68-cinematic-engine">
(function(){
  'use strict';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const sections=[...document.querySelectorAll('main>section')];
  if(!sections.length) return;
  let ticking=false;
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function render(){
    ticking=false;
    const vh=Math.max(1,innerHeight);
    sections.forEach((s)=>{
      const r=s.getBoundingClientRect();
      if(r.bottom < -vh*0.35 || r.top > vh*1.35){
        s.style.setProperty('--mb68-shift','0px');
        s.style.setProperty('--mb68-scale','1');
        s.style.setProperty('--mb68-opacity','1');
        return;
      }
      /* 0 = just entering from below, 0.5 = centered, 1 = leaving above. */
      const p=clamp((vh-r.top)/(vh+r.height),0,1);
      const centered=1-Math.min(1,Math.abs(p-.5)*2);
      const shift=((.5-p)*42);
      const scale=.985+(centered*.015);
      const opacity=.76+(centered*.24);
      s.style.setProperty('--mb68-shift',shift.toFixed(2)+'px');
      s.style.setProperty('--mb68-scale',scale.toFixed(4));
      s.style.setProperty('--mb68-opacity',opacity.toFixed(3));
    });
  }
  function request(){if(!ticking){ticking=true;requestAnimationFrame(render)}}
  addEventListener('scroll',request,{passive:true});
  addEventListener('resize',request,{passive:true});
  addEventListener('orientationchange',()=>setTimeout(request,80),{passive:true});
  request();
  addEventListener('load',()=>setTimeout(request,120),{once:true});
})();
</script>

for (const key of order) {
  const b = document.createElement('button');
  b.textContent = pages[key].label;
  b.dataset.key = key;
  b.onclick = () => showPage(key);
  nav.appendChild(b);
}

function decodePage(key){
  const bin = atob(pages[key].b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function showPage(key){
  current = key;
  frame.srcdoc = decodePage(key);
  [...nav.children].forEach(b => b.classList.toggle('active', b.dataset.key === key));
}

function keyFromHref(href){
  if(!href) return null;
  href = href.split('#')[0].split('?')[0];
  const map = {};
  for(const k of order) map[pages[k].filename] = k;
  if(href === '' || href === 'index.html') return 'home';
  return map[href] || null;
}

frame.addEventListener('load', () => {
  try{
    const doc = frame.contentDocument;
    // Keep service-page navigation inside this single preview.
    doc.querySelectorAll('a').forEach(a => {
      const href = a.getAttribute('href') || '';
      const key = keyFromHref(href);
      if(key){
        a.addEventListener('click', e => {
          e.preventDefault();
          showPage(key);
        });
      }
    });
    // Home's service links can use either root filenames or older paths.
    doc.querySelectorAll('a').forEach(a => {
      const href = a.getAttribute('href') || '';
    });
  }catch(err){}
});

showPage('home');
</script>

<script id="mediabay-v65-motion-fix-js">
(function(){
  function boot(){
    const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    const sections=[...document.querySelectorAll('main > section')];
    if(!sections.length)return;

    /* Only V65-managed elements are hidden. Existing content can never disappear because
       of an observer timing failure. */
    const selectors=[
      '.head','.giant','.desc','.facts','.contact-copy h2','.contact-form',
      '.approach-intro > div','.diagnostic','.approach-bottom','.service-detail',
      '.service-note','.project','.client','.internal-tech'
    ];
    const els=[];
    sections.forEach(section=>{
      selectors.forEach(sel=>section.querySelectorAll(sel).forEach(el=>{if(!els.includes(el))els.push(el)}));
    });

    if(reduce){els.forEach(el=>el.classList.remove('mb65-reveal'));return;}
    els.forEach((el,i)=>{
      el.classList.remove('mb-premium-reveal','mb-premium-visible','mb-reveal','mb-visible','mb-title','mb-service','mb-hidden');
      el.classList.add('mb65-reveal');
      el.dataset.mb65Delay=String((i%5)+1);
    });

    const reveal=el=>{el.classList.add('mb65-visible');};
    const io=new IntersectionObserver(entries=>entries.forEach(entry=>{
      if(entry.isIntersecting){reveal(entry.target);io.unobserve(entry.target)}
    }),{threshold:0.02,rootMargin:'0px 0px -4% 0px'});
    els.forEach(el=>io.observe(el));

    /* Guarantee the first visible frame is revealed even on browsers that restore scroll
       position before IntersectionObserver has delivered its first batch. */
    const revealVisible=()=>{
      const vh=innerHeight||document.documentElement.clientHeight;
      els.forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom>0&&r.top<vh*.96)reveal(el)});
    };
    requestAnimationFrame(()=>requestAnimationFrame(revealVisible));
    addEventListener('pageshow',()=>setTimeout(revealVisible,30),{passive:true});

    /* Controlled image depth: tiny, never enough to alter layout. */
    const imgs=[...document.querySelectorAll('main section img:not(.logo img):not(.site-header img)')];
    imgs.forEach(img=>img.classList.add('mb65-depth'));
    let ticking=false;
    const frame=()=>{
      ticking=false;const vh=innerHeight||1;
      imgs.forEach(img=>{const r=img.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;const p=(r.top+r.height/2-vh/2)/(vh/2);img.style.transform='translate3d(0,'+Math.max(-8,Math.min(8,-p*7)).toFixed(2)+'px,0)'});
    };
    addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(frame)}},{passive:true});
    addEventListener('resize',frame,{passive:true});frame();

    /* Quiet desktop magnetic response. */
    if(matchMedia('(hover:hover) and (pointer:fine)').matches){
      document.querySelectorAll('.menu-btn,.next,.scroll-dot,.project-open,.page-close,.interactive-tag').forEach(el=>{
        el.classList.add('mb65-magnetic');
        el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left-r.width/2)*.12,y=(e.clientY-r.top-r.height/2)*.12;el.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)'},{passive:true});
        el.addEventListener('pointerleave',()=>el.style.transform='');
      });
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script id="mediabay-v66-motion-js">
(function(){
  'use strict';
  const reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const candidates=[...document.querySelectorAll(
    'main > section .head, main > section .giant, main > section .desc,'+
    'main > section .manifesto-statement, main > section .manifesto-copy,'+
    'main > section .manifesto-pillars, main > section .service-detail,'+
    'main > section .service-note, main > section .diagnostic,'+
    'main > section .approach-bottom, main > section .internal-tech,'+
    'main > section .project, main > section .client,'+
    'main > section .experience-intro, main > section .sector-list,'+
    'main > section .proof, main > section .contact-copy h2,'+
    'main > section .contact-form'
  )];
  if(!candidates.length) return;

  candidates.forEach((el,i)=>{
    /* Remove every legacy hidden state, then opt into the safe V66 choreography. */
    el.classList.remove('mb65-reveal','mb65-visible','mb-hidden','mb-premium-reveal','mb-premium-visible');
    el.classList.add('mb66-motion');
    el.style.setProperty('--mb66-delay',((i%5)*70)+'ms');
  });

  if(reduce) return;

  const play=(el)=>{
    if(el.dataset.mb66Played==='1') return;
    el.dataset.mb66Played='1';
    /* Force a clean animation even if a previous class/state touched transform. */
    el.classList.remove('mb66-play');
    void el.offsetWidth;
    el.classList.add('mb66-play');
  };

  const io=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        play(entry.target);
        io.unobserve(entry.target);
      }
    });
  },{threshold:0.04,rootMargin:'0px 0px -3% 0px'});

  candidates.forEach(el=>io.observe(el));

  /* Initial viewport: explicitly play only what is visible. */
  const revealInitial=()=>{
    const vh=innerHeight||document.documentElement.clientHeight;
    candidates.forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.bottom>0 && r.top<vh*.98) play(el);
    });
  };
  requestAnimationFrame(()=>requestAnimationFrame(revealInitial));

  /* Smooth, tiny depth effect — transform only, never opacity/display. */
  const depthTargets=[...document.querySelectorAll('main > section .giant, main > section .manifesto-statement')];
  let ticking=false;
  const depth=()=>{
    ticking=false;
    const vh=innerHeight||1;
    depthTargets.forEach(el=>{
      if(!el.dataset.mb66Played) return;
      const r=el.getBoundingClientRect();
      if(r.bottom<0 || r.top>vh) return;
      const p=(r.top+r.height/2-vh/2)/(vh/2);
      const y=Math.max(-5,Math.min(5,-p*3));
      /* Only apply depth after the entrance animation has completed. */
      el.style.setProperty('--mb66-depth',y.toFixed(2)+'px');
    });
  };
  addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(depth)}},{passive:true});
  addEventListener('resize',depth,{passive:true});
  depth();

  /* V92 — internal HTML navigation uses the same preloader on the destination page. */
})();
</script>
<script id="mediabay-v92-preloader">
(function(){
  const loader=document.getElementById('preloader');
  if(!loader)return;
  document.body.classList.add('loading');
  function finish(){
    setTimeout(function(){
      loader.classList.add('done');
      document.body.classList.remove('loading');
      setTimeout(function(){if(loader.parentNode)loader.remove()},950);
    },650);
  }
  if(document.readyState==='complete') finish();
  else window.addEventListener('load',finish,{once:true});
})();
</script>

<script id="mediabay-cookie-script">
(function(){
  const KEY='mediabay_cookie_notice_v1';
  const banner=document.getElementById('mb-cookie-banner');
  if(!banner)return;
  function hide(){banner.style.display='none';}
  function show(){banner.style.display='block';}
  try{if(!localStorage.getItem(KEY)) show();}catch(e){show();}
  const setCopy=(lang)=>{
    banner.querySelectorAll('[data-cookie-it]').forEach(el=>{
      const v=el.getAttribute(lang==='it'?'data-cookie-it':'data-cookie-en');
      if(v!==null) el.textContent=v;
    });
  };
  setCopy(localStorage.getItem('mediabay-language')||'it');
  banner.querySelector('.mb-cookie-accept').addEventListener('click',function(){try{localStorage.setItem(KEY,'accepted')}catch(e){} hide();});
  document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setCopy(btn.dataset.lang)));
})();
