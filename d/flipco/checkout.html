<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Flip&Co</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="style.css"></head><body class="commerce-page z-checkout-page"><header class="site-header"><a class="brand-logo" href="index.html"><img src="assets/logo-flipco-dark.png" alt="Flip&Co"></a><a class="header-back" href="shop.html">← SHOP</a><div></div></header><main class="z-checkout"><section class="z-checkout-form"><div class="z-checkout-title"><span>FLIP&CO / CHECKOUT</span><h1>IL TUO<br><em>ORDINE.</em></h1></div><form id="checkoutForm" novalidate><fieldset><legend>01 / CONTATTI</legend><div class="z-form-grid"><label>Nome<input name="firstName" required autocomplete="given-name"></label><label>Cognome<input name="lastName" required autocomplete="family-name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Telefono<input name="phone" required autocomplete="tel"></label></div></fieldset><fieldset><legend>02 / CONSEGNA</legend><div class="z-choice"><label><input type="radio" name="delivery" value="shipping" checked><span>SPEDIZIONE A DOMICILIO<small>€ 5,90 · gratuita da € 99</small></span></label><label><input type="radio" name="delivery" value="pickup"><span>RITIRO IN STORE<small>Via Italia 22 · gratuito</small></span></label></div><div id="addressFields" class="z-form-grid"><label class="wide">Indirizzo<input name="address" required autocomplete="street-address"></label><label>CAP<input name="zip" required autocomplete="postal-code"></label><label>Città<input name="city" required autocomplete="address-level2"></label></div></fieldset><fieldset><legend>03 / PAGAMENTO</legend><div class="z-choice"><label><input type="radio" name="payment" value="card" checked><span>CARTA<small>Pagamento sicuro · provider collegato al go-live</small></span></label><label><input type="radio" name="payment"
