<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<style>
.shop-page{background:var(--bg);color:var(--ink);min-height:100vh}.shop-header{padding:110px clamp(22px,5vw,80px) 42px;border-bottom:1px solid var(--line)}
.shop-head-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.5fr);gap:40px;align-items:end}.shop-title{font:800 clamp(62px,11vw,160px)/.82 Manrope;letter-spacing:-.07em;margin:0}.shop-title span{opacity:.18}.shop-intro{max-width:430px;font-size:16px;line-height:1.55}.shop-stock{margin-top:28px;padding-top:15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;font:800 10px/1 Manrope;letter-spacing:.12em}.shop-toolbar{padding:18px clamp(22px,5vw,80px);display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(242,240,234,.92);backdrop-filter:blur(16px);z-index:20}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:transparent;padding:10px 13px;font:800 9px/1 Manrope;letter-spacing:.12em;cursor:pointer}.filter.active,.filter:hover{background:var(--ink);color:var(--bg)}.cart-open{border:0;background:var(--ink);color:var(--bg);padding:12px 15px;font:800 9px/1 Manrope;letter-spacing:.12em;cursor:pointer}.cart-count{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--ink);margin-left:6px}
.product-grid{padding:34px clamp(22px,5vw,80px) 110px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}.product-card{background:var(--bg);min-height:460px;display:flex;flex-direction:column;cursor:pointer}.product-visual{aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:space-between;padding:18px;background:#dedbd2;position:relative;overflow:hidden}.product-visual:after{content:"";position:absolute;width:52%;aspect-ratio:1;border:1px solid rgba(17,18,15,.18);border-radius:50%;right:-10%;bottom:-8%}.product-no{font:800 10px/1 Manrope;letter-spacing:.14em;opacity:.45}.product-category{font:800 clamp(46px,6vw,92px)/.8 Manrope;letter-spacing:-.07em;position:relative;z-index:1}.product-info{padding:17px 2px 22px;display:grid;grid-template-columns:1fr auto;gap:10px}.product-brand{font:800 10px/1 Manrope;letter-spacing:.12em;text-transform:uppercase}.product-name{margin-top:8px;font-size:15px}.product-price{font:800 14px/1 Manrope}.product-meta{margin-top:12px;font:700 9px/1 Manrope;letter-spacing:.1em;opacity:.55}.quick-add{grid-column:1/-1;border:1px solid var(--ink);background:transparent;padding:11px;text-align:center;font:800 9px/1 Manrope;letter-spacing:.12em;cursor:pointer}.quick-add:hover{background:var(--ink);color:var(--bg)}
.cart-drawer{position:fixed;inset:0 0 0 auto;width:min(460px,100%);background:var(--bg);z-index:100;transform:translateX(105%);transition:transform .35s ease;box-shadow:-20px 0 60px rgba(0,0,0,.16);display:flex;flex-direction:column}.cart-drawer.open{transform:translateX(0)}.cart-head{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.cart-close{border:0;background:none;font:800 20px Manrope;cursor:pointer}.cart-items{flex:1;overflow:auto;padding:20px}.cart-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:17px 0;border-top:1px solid var(--line)}.cart-item:first-child{border-top:0}.cart-item small{display:block;opacity:.5;margin-top:6px}.remove{border:0;background:none;text-decoration:underline;cursor:pointer;font-size:10px}.cart-foot{padding:20px;border-top:1px solid var(--line)}.cart-total{display:flex;justify-content:space-between;font:800 15px Manrope;margin-bottom:15px}.checkout{display:block;width:100%;border:0;background:var(--ink);color:var(--bg);padding:15px;text-align:center;font:800 10px Manrope;letter-spacing:.14em;cursor:pointer;text-decoration:none}.shop-back{position:absolute;top:24px;left:clamp(22px,5vw,80px);font:800 9px Manrope;letter-spacing:.14em;text-decoration:none;color:var(--ink)}.size-select{margin-top:8px;width:100%;padding:9px;border:1px solid var(--line);background:var(--bg);font:600 11px Manrope}
@media(max-width:800px){.shop-head-grid{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.product-card{min-height:390px}.product-category{font-size:54px}}
@media(max-width:520px){.shop-header{padding-top:90px}.shop-title{font-size:64px}.product-grid{grid-template-columns:1fr}.product-card{min-height:480px}.shop-toolbar{align-items:flex-start;flex-direction:column}.cart-open{align-self:stretch}}
</style></head><body>
<header class="site-header"><div class="header-inner"><a class="brandmark" href="index.html#top" aria-label="Flip&Co"><img src="assets/logo-flipco.png" alt="Flip&Co"></a><div class="header-actions"><a class="shop-nav-home" href="index.html">← STORE</a></div></div></header>
<main class="shop-page"><section class="shop-header"><a class="shop-back" href="index.html">← FLIP&CO</a><div class="shop-head-grid"><div><span class="micro">05 / FLIP&CO ONLINE</span><h1 class="shop-title">SCOPRI.<br><span>SCEGLI.</span><br>ACQUISTA.</h1></div><div><p class="shop-intro">La selezione Flip&Co è anche online. Esplora i prodotti disponibili, scegli il modello e la taglia e acquista direttamente dal nostro store.</p><div class="shop-stock"><strong>UN SOLO STOCK.</strong><span>ONLINE + IN STORE</span></div></div></div></section>
<section class="shop-toolbar"><div class="filters"><button class="filter active" data-cat="TUTTI">TUTTI</button><button class="filter" data-cat="UOMO">UOMO</button><button class="filter" data-cat="DONNA">DONNA</button><button class="filter" data-cat="KIDS">KIDS</button></div><button class="cart-open" id="cartOpen">CARRELLO <span class="cart-count" id="cartCount">0</span></button></section>
<section class="product-grid" id="productGrid"></section></main>
<aside class="cart-drawer" id="cartDrawer" aria-hidden="true"><div class="cart-head"><strong class="micro">IL TUO CARRELLO</strong><button class="cart-close" id="cartClose">×</button></div><div class="cart-items" id="cartItems"></div><div class="cart-foot"><div class="cart-total"><span>TOTALE</span><span id="cartTotal">€0,00</span></div><a class="checkout" href="https://wa.me/393661087819?text=Ciao%20Flip%26Co%2C%20vorrei%20procedere%20con%20un%20ordine%20online." target="_blank" rel="noopener">PROCEDI CON L'ORDINE ↗</a></div></aside>
<script src="shop.js"></script></body></html>
