<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Inventario — Flip&Co</title><link rel="stylesheet" href="../style.css"></head><body><main class="importer"><span class="eyebrow">FLIP&CO / BACK OFFICE</span><h1>IMPORTA<br><em>INVENTARIO.</em></h1><p>CSV: sku,brand,name,category,price,size,qty,season. Una riga per SKU/taglia. Il tool aggrega automaticamente le quantità.</p><div class="import-card"><input type="file" id="csv" accept=".csv,text/csv"><button class="btn btn-primary" id="run">VALIDA E PREPARA JSON</button><pre id="report"></pre><a id="download" class="btn btn-secondary" hidden>SCARICA INVENTORY.JSON</a></div></main><script>document.getElementById('run').onclick=()=>{const f=document.getElementById('csv').files[0],r=document.getElementById('report');if(!f){r.textContent='Seleziona un CSV.';return}const rd=new FileReader();rd.onload=()=>{const lines=rd.result.trim().split(/\r?\n/),h=lines.shift().split(',').map(x=>x.trim()),idx=Object.fromEntries(h.map((x,i)=>[x,i])),g={};lines.forEach(line=>{const a=line.split(',');const sku=a[idx.sku];if(!sku)return;if(!g[sku])g[sku]={sku,brand:a[idx.brand],name:a[idx.name],category:a[idx.category],price:Number(a[idx.price]),season:a[idx.season],stock:{}};g[sku].stock[a[idx.size]]=Number(a[idx.qty]||0)});const out={version:new Date().toISOString().slice(0,10),warehouse:'FLIPCO-CAGLIARI',model:'single_inventory',products:Object.values(g)};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),dl=document.getElementById('download');dl.href=URL.createObjectURL(blob);dl.download='inventory.json';dl.hidden=false;r.textContent=`Validato: ${out.products.length} SKU.`};rd.readAsText(f)}</script></body></html>
