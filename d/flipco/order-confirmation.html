<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordine ricevuto — Flip&Co</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="brand-logo" href="index.html"><img src="assets/logo-flipco.png" alt="Flip&Co"></a></header><main class="confirmation"><span class="eyebrow">FLIP&CO / ORDINE</span><div class="confirmation-mark">✓</div><h1>ORDINE<br><em>RICEVUTO.</em></h1><p id="confirmationText">Abbiamo ricevuto la tua richiesta.</p><div class="confirmation-card" id="orderCard"></div><a class="btn btn-primary" href="shop.html">TORNA ALLO SHOP</a></main><script>const o=JSON.parse(localStorage.getItem('flipco_last_order')||'null');if(o){document.getElementById('confirmationText').textContent=o.customer.delivery==='pickup'?'Richiesta di ritiro in store ricevuta.':'Ordine registrato. Il pagamento reale verrà confermato dal provider al go-live.';document.getElementById('orderCard').innerHTML=`<span>ORDINE</span><strong>${o.id}</strong><span>TOTALE</span><strong>${new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(o.total)}</strong><span>STATO</span><strong>IN ATTESA DI PAGAMENTO</strong>`}</script></main></body></html>
