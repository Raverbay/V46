<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Ordine — Flip&Co</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="header.css"></head><body>

<header class="site-header"><a class="brand-logo" href="index.html"><img src="assets/logo-flipco.png" alt="Flip&Co"></a><a class="header-back" href="shop.html" aria-label="Torna allo shop">← <span>SHOP</span></a><div class="header-actions"><button class="menu-button" id="menuBtn" type="button" aria-label="Apri menu" aria-expanded="false"><span>MENU</span><i aria-hidden="true"><b></b><b></b></i></button></div></header><main class="confirmation"><span class="eyebrow">FLIP&CO / ORDINE</span><div class="confirmation-mark">✓</div><h1>RICHIESTA<br><em>RICEVUTA.</em></h1><p id="confirmationText">Abbiamo ricevuto i dati del tuo ordine.</p><div class="confirmation-card" id="orderCard"></div><a class="btn btn-primary" href="shop.html">TORNA ALLO SHOP</a></main><script>const o=JSON.parse(localStorage.getItem('flipco_last_order')||'null');if(o){const pickup=o.customer?.delivery==='pickup';document.getElementById('confirmationText').textContent=pickup?'Richiesta di ritiro in store ricevuta.':'Richiesta ordine ricevuta. Il pagamento online verrà confermato dal provider al go-live.';document.getElementById('orderCard').innerHTML=`<span>ORDINE</span><strong>${o.id}</strong><span>TOTALE</span><strong>${new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(o.total)}</strong><span>STATO</span><strong>${o.status==='pending_store_payment'?'IN ATTESA DI PAGAMENTO AL RITIRO':'IN ATTESA DI PAGAMENTO'}</strong>`}</script><script src="nav.js"></script>
</body></html>
